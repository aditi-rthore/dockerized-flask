name: Build and Deploy Flask Application

on:
  push:
    branches:
      - main

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v6


      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # 4. Build and push Flask image
      - name: Build and push Flask image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: aditirthore/dockerized-flask:latest


      # 5. Build and push Nginx image
      - name: Build and push Nginx image
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: aditirthore/dockerized-flask-nginx:latest

      # 6. Deploy to EC2      
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |

          mkdir -p ~/.ssh

          echo "$EC2_SSH_KEY" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key ubuntu@"$EC2_HOST" << 'EOF'

            cd ~/dockerized-flask

            docker compose pull

            docker compose up -d

            docker image prune -f

          EOF
